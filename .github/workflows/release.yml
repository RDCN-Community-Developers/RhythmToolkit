name: Release NuGet

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Optional version suffix (e.g. -beta1)'
        required: false
        default: ''
  workflow_call:
    inputs:
      version_suffix:
        type: string
        default: ''

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: ver
        run: |
          BASE_VER=$(grep -oP '<Version>\K[^<]+' RhythmBase/RhythmBase.csproj)
          SUFFIX="${{ inputs.version_suffix }}"
          echo "version=${BASE_VER}${SUFFIX}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore RhythmBase/RhythmBase.csproj

      - name: Build
        run: dotnet build RhythmBase/RhythmBase.csproj -c Release --no-restore

      - name: Pack RhythmBase (core)
        run: dotnet pack RhythmBase/RhythmBase.csproj -c Release --no-build -o ./pkg -p:Version=${{ steps.ver.outputs.version }}

      - name: Add local NuGet source
        run: dotnet nuget add source ${{ github.workspace }}/pkg --name local-pkg

      - name: Restore sub-packages
        run: |
          for PROJ in RhythmBase.RhythmDoctor RhythmBase.BeatBlock RhythmBase.Adofai RhythmBase.Rizline; do
            dotnet restore "$PROJ/$PROJ.csproj"
          done

      - name: Build sub-packages
        run: |
          for PROJ in RhythmBase.RhythmDoctor RhythmBase.BeatBlock RhythmBase.Adofai RhythmBase.Rizline; do
            dotnet build "$PROJ/$PROJ.csproj" -c Release --no-restore
          done

      - name: Pack sub-packages
        run: |
          for PROJ in RhythmBase.RhythmDoctor RhythmBase.BeatBlock RhythmBase.Adofai RhythmBase.Rizline; do
            dotnet pack "$PROJ/$PROJ.csproj" -c Release --no-build -o ./pkg -p:Version=${{ steps.ver.outputs.version }}
          done

      - name: Push to NuGet (Trusted Publishing)
        run: |
          OIDC_TOKEN=$(curl -s -H "Authorization: bearer $ACTIONS_ID_TOKEN_REQUEST_TOKEN" \
            "$ACTIONS_ID_TOKEN_REQUEST_URL&audience=api://AzureADTokenExchange" | jq -r '.value')
          NUGET_KEY=$(curl -s -X POST "https://api.nuget.org/v3/oidc/github" \
            -H "Content-Type: application/json" \
            -d "{\"token\": \"$OIDC_TOKEN\"}" | jq -r '.apiKey')
          dotnet nuget push ./pkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key "$NUGET_KEY" --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: ./pkg/*.nupkg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
