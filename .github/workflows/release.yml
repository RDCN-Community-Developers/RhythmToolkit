name: Release NuGet

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Optional version suffix (e.g. -beta1)'
        required: false
        default: ''
  workflow_call:
    inputs:
      version_suffix:
        type: string
        default: ''

permissions:
  id-token: write
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve version
        id: ver
        run: |
          BASE_VER=$(grep -oP '<Version>\K[^<]+' RhythmBase/RhythmBase.csproj)
          SUFFIX="${{ inputs.version_suffix }}"
          echo "version=${BASE_VER}${SUFFIX}" >> $GITHUB_OUTPUT

      - name: Check if version already exists
        run: |
          VER="${{ steps.ver.outputs.version }}"
          EXISTING=$(curl -sfL "https://api.nuget.org/v3-flatcontainer/rhythmbase/index.json" | jq -r '.versions[]' | grep -xF "$VER" || true)
          if [ -n "$EXISTING" ]; then
            echo "::error::Version $VER already exists on NuGet. Aborting."
            exit 1
          fi
          echo "Version $VER is available on NuGet."

      - name: Restore
        run: dotnet restore RhythmBase/RhythmBase.csproj

      - name: Build
        run: dotnet build RhythmBase/RhythmBase.csproj -c Release --no-restore

      - name: Pack RhythmBase (core)
        run: dotnet pack RhythmBase/RhythmBase.csproj -c Release --no-build -o ./pkg -p:Version=${{ steps.ver.outputs.version }}

      - name: Pack RhythmBase (base, for local source)
        run: dotnet pack RhythmBase/RhythmBase.csproj -c Release --no-build -o ./local-pkg

      - name: Add local NuGet source
        run: |
          dotnet nuget remove source local || true
          dotnet nuget add source ${{ github.workspace }}/local-pkg --name local

      - name: Restore sub-packages
        run: |
          for PROJ in RhythmBase.RhythmDoctor RhythmBase.BeatBlock RhythmBase.Adofai RhythmBase.Rizline; do
            dotnet restore "$PROJ/$PROJ.csproj"
          done

      - name: Build sub-packages
        run: |
          for PROJ in RhythmBase.RhythmDoctor RhythmBase.BeatBlock RhythmBase.Adofai RhythmBase.Rizline; do
            dotnet build "$PROJ/$PROJ.csproj" -c Release --no-restore
          done

      - name: Pack sub-packages
        run: |
          for PROJ in RhythmBase.RhythmDoctor RhythmBase.BeatBlock RhythmBase.Adofai RhythmBase.Rizline; do
            dotnet pack "$PROJ/$PROJ.csproj" -c Release --no-build -o ./pkg -p:Version=${{ steps.ver.outputs.version }}
          done

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push to NuGet
        run: dotnet nuget push ./pkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          files: ./pkg/*.nupkg
          generate_release_notes: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
