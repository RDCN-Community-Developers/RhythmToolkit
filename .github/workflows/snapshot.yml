name: Snapshot NuGet

on:
  workflow_dispatch:
    inputs:
      version_suffix:
        description: 'Optional version label (e.g. ci-test). A build timestamp is always appended.'
        required: false
        default: ''
  workflow_call:
    inputs:
      version_suffix:
        type: string
        default: ''

permissions:
  contents: write
  id-token: write

jobs:
  snapshot:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: 8.0.x

      - name: Resolve snapshot version
        id: ver
        run: |
          BASE_VER=$(grep -oP '<Version>\K[^<]+' RhythmBase/RhythmBase.csproj)
          LABEL="${{ inputs.version_suffix }}"
          TIMESTAMP=$(date -u +%Y%m%d%H%M%S)
          if [ -z "$LABEL" ]; then
            LABEL="snapshot"
          fi
          echo "version=${BASE_VER}-${LABEL}.${TIMESTAMP}" >> $GITHUB_OUTPUT

      - name: Restore
        run: dotnet restore RhythmBase/RhythmBase.csproj

      - name: Build
        run: dotnet build RhythmBase/RhythmBase.csproj -c Release --no-restore

      - name: Pack RhythmBase (core)
        run: dotnet pack RhythmBase/RhythmBase.csproj -c Release --no-build -o ./pkg -p:Version=${{ steps.ver.outputs.version }}

      - name: Add local NuGet source
        run: dotnet nuget add source ${{ github.workspace }}/pkg --name local-pkg

      - name: Restore sub-packages
        run: |
          for PROJ in RhythmBase.RhythmDoctor RhythmBase.BeatBlock RhythmBase.Adofai RhythmBase.Rizline; do
            dotnet restore "$PROJ/$PROJ.csproj"
          done

      - name: Build sub-packages
        run: |
          for PROJ in RhythmBase.RhythmDoctor RhythmBase.BeatBlock RhythmBase.Adofai RhythmBase.Rizline; do
            dotnet build "$PROJ/$PROJ.csproj" -c Release --no-restore
          done

      - name: Pack sub-packages
        run: |
          for PROJ in RhythmBase.RhythmDoctor RhythmBase.BeatBlock RhythmBase.Adofai RhythmBase.Rizline; do
            dotnet pack "$PROJ/$PROJ.csproj" -c Release --no-build -o ./pkg -p:Version=${{ steps.ver.outputs.version }}
          done

      - name: NuGet login (OIDC)
        uses: NuGet/login@v1
        id: login
        with:
          user: ${{ secrets.NUGET_USER }}

      - name: Push snapshot to NuGet
        run: dotnet nuget push ./pkg/*.nupkg --source https://api.nuget.org/v3/index.json --api-key ${{ steps.login.outputs.NUGET_API_KEY }} --skip-duplicate

      - name: Create GitHub Pre-release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: v${{ steps.ver.outputs.version }}
          name: v${{ steps.ver.outputs.version }}
          body: |
            Snapshot build.

            Version: `${{ steps.ver.outputs.version }}`
          files: ./pkg/*.nupkg
          prerelease: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}